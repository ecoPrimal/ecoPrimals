# Gaia Blood-Brain Barrier — Input Mesh Configuration
# eastGate is the BRAIN (server) — all gates connect as clients
# The CNS carries input signals, the PNS carries sensory data

section: screens
    # CNS — House 1 (Brain Side)
    eastgate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
        halfDuplexScrollLock = false
        xtestIsXineramaUnaware = false
        switchCorners = none
        switchCornerSize = 0
    northgate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
        halfDuplexScrollLock = false
        xtestIsXineramaUnaware = false
        switchCorners = none
        switchCornerSize = 0
    graftgate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
    sporegate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
    # PNS — House 2 (South Pole)
    southgate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
    irongate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
    bluegate:
        halfDuplexCapsLock = false
        halfDuplexNumLock = false
end

section: aliases
end

section: links
    # DESK 4 LAYOUT: northgate LEFT ↔ eastgate RIGHT
    eastgate:
        left = northgate
        up = graftgate
        down = sporegate
    northgate:
        right = eastgate
        up = irongate
        down = bluegate
    # CNS mesh — all gates reachable
    graftgate:
        down = eastgate
        right = northgate
    sporegate:
        up = eastgate
        right = southgate
    irongate:
        down = northgate
        left = graftgate
    bluegate:
        up = northgate
        left = sporegate
    southgate:
        left = sporegate
end

section: options
    relativeMouseMoves = false
    screenSaverSync = true
    win32KeepForeground = false
    clipboardSharing = true
    switchCorners = none
    switchCornerSize = 0
    switchDelay = 100
    switchDoubleTap = 250
    heartbeat = 5000
end
